name: OmniConverter CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-lint:
    name: Run Linters & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg, poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Linter Checks (Flake8 & Black)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check . --exclude "/(scratch|\.git|__pycache__)/" || true

      - name: Execute Pytest Suite
        run: |
          python -m pytest tests/ --verbose
